<!doctype html><meta charset="utf-8"><title>六相机 SAM 标注</title><style>body{background:#191d22;color:#eee;font:15px sans-serif;margin:12px}header{position:sticky;top:0;background:#252b32;padding:10px;z-index:2}button,select,input{padding:5px;margin:3px;font:inherit}#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.pane{border:2px solid #555}.pane.active{border-color:#5af}canvas{width:100%;display:block;touch-action:none}.label{padding:5px}#msg{color:#ffcd7e;white-space:pre-wrap}.pane.zoom{grid-column:1/-1;width:90%;margin:auto}label{white-space:nowrap}body.busy button,body.busy select{pointer-events:none;opacity:.5}@media(max-width:900px){#grid{grid-template-columns:repeat(2,1fr)}}</style>
<header><b>六路二维语义／实例标注</b><button id="prev">上一帧</button><button id="next">NEXT · 保存并下一帧</button>帧<input id="frame" type="number" value="0" min="0" style="width:75px"><button id="go">跳转（不跨帧追踪）</button><span id="stamp"></span><br>
目标<select id="object"><option value="">新建目标</option></select>类别<select id="class"></select>
模式<select id="mode"><option value="box">智能框选（自动SAM）</option><option value="brush">手动画区域</option></select>笔刷<input id="size" type="range" min="3" max="100" value="20"><label><input id="erase" type="checkbox">手动擦除</label><button id="polygon" hidden>闭合</button><button id="sam" hidden>调用SAM</button><button id="undo">撤销</button><button id="clear">清空当前草稿</button><br>
<label><input id="auto" type="checkbox" checked>下一帧追踪</label><label><input id="crossauto" type="checkbox" checked>保存／追踪后自动跨相机关联</label><button id="save" hidden>确认类别和ID并保存</button><button id="cross" hidden>关联到其他相机</button><button id="stop">删除目标并停止后续追踪</button><button id="approve" hidden>确认本帧六路自动结果</button><button id="export">导出本帧标签</button><label><input id="overlay" type="checkbox" checked>显示标签</label></header>
<p>点击相机选择操作窗口；双击标题放大。智能框选：拖框松手自动分割，随后确认类别和ID。手动画区域：笔刷修正后直接点NEXT。检查本帧后点击 NEXT，自动确认六路标签、保存并导出，然后追踪下一帧。未标注区域仍为ignore=255。跨相机不保证无重叠视野的目标自动关联。</p><div id="msg"></div><div id="grid"></div>
<dialog id="confirmDialog"><h3>确认目标类别和ID</h3><p>新目标请选择“新建目标”；同一实体跨相机请选择已有ID。</p><label>ID <select id="identity"></select></label><label>类别 <select id="category"></select></label><p><button id="commit">确认保存并跨相机匹配</button><button id="cancelConfirm">返回修正</button></p></dialog><script>
const $=id=>document.getElementById(id);let nextAfterConfirm=false;let data=null,f=0,active=0,dirty=false,busy=false,images=[],layers=[],cv=[],draft=document.createElement('canvas'),box=null,points=[],labels=[],poly=[],undo=[],drawing=false,last=null;draft.width=1024;draft.height=768;const dc=draft.getContext('2d');
function msg(t){$('msg').textContent=t}function color(id){return `hsl(${Number(id)*137.5%360},90%,60%)`}function loadImage(url){return new Promise((res,rej)=>{let im=new Image;im.onload=()=>res(im);im.onerror=rej;im.src=url})}async function api(path,d){let r=await fetch(path,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}),v=await r.json();if(!r.ok)throw Error(v.error);return v}
async function task(fn){if(busy)return;busy=true;document.body.classList.add('busy');msg('处理中… 首次SAM加载和图像编码可能需要等待');try{await fn()}catch(e){msg(e.message)}finally{busy=false;document.body.classList.remove('busy')}}
function reset(){dc.clearRect(0,0,1024,768);box=null;points=[];labels=[];poly=[];undo=[];dirty=false}function snap(){undo.push(dc.getImageData(0,0,1024,768));if(undo.length>15)undo.shift()}
async function display(d){data=d;f=d.frame;$('frame').value=f;$('frame').max=d.count-1;$('stamp').textContent=`${d.timestamp} (${f+1}/${d.count})`;let selected=$('object').value;$('object').innerHTML='<option value="">新建目标</option>'+Object.entries(d.objects).filter(([id,o])=>o.start<=f&&(o.stop===null||f<o.stop)).map(([id,o])=>`<option value="${id}">#${id} ${d.classes[o.class_id]}</option>`).join('');$('object').value=selected;$('class').innerHTML=Object.entries(d.classes).map(([id,n])=>`<option value="${id}">${id} ${n}</option>`).join('');$('class').value=d.objects[$('object').value]?.class_id??2;
 images=await Promise.all(d.cameras.map(c=>c.exists?loadImage(`/image?f=${f}&c=${c.cam}`):null));layers=await Promise.all(d.cameras.map(c=>Promise.all(c.entries.map(async e=>({...e,im:await loadImage(e.mask_data)})))));render()}
function render(){if(!data)return;for(let c=0;c<6;c++){let ctx=cv[c].getContext('2d');ctx.fillStyle='#111';ctx.fillRect(0,0,1024,768);if(images[c])ctx.drawImage(images[c],0,0);if($('overlay').checked){for(let e of layers[c]){if(c===active&&e.id===$('object').value)continue;let t=document.createElement('canvas');t.width=1024;t.height=768;let z=t.getContext('2d');z.drawImage(e.im,0,0);let p=z.getImageData(0,0,1024,768);for(let j=0;j<p.data.length;j+=4)p.data[j+3]=p.data[j]>127?110:0;z.putImageData(p,0,0);z.globalCompositeOperation='source-in';z.fillStyle=color(e.id);z.fillRect(0,0,1024,768);ctx.drawImage(t,0,0)}}for(let e of layers[c]){if(!e.box)continue;ctx.strokeStyle=color(e.id);ctx.lineWidth=3;ctx.setLineDash(e.reviewed?[]:[8,6]);ctx.strokeRect(e.box[0],e.box[1],e.box[2]-e.box[0],e.box[3]-e.box[1]);ctx.setLineDash([]);ctx.fillStyle=color(e.id);ctx.font='24px sans-serif';ctx.fillText('#'+e.id+' '+data.classes[e.class_id]+(e.reviewed?'':' 待确认'),e.box[0],Math.max(26,e.box[1]-5))}if(c===active){ctx.globalAlpha=.45;ctx.drawImage(draft,0,0);ctx.globalAlpha=1;ctx.strokeStyle='#00ff88';ctx.lineWidth=3;if(box)ctx.strokeRect(box[0],box[1],box[2]-box[0],box[3]-box[1]);if(poly.length){ctx.beginPath();ctx.moveTo(...poly[0]);for(let p of poly.slice(1))ctx.lineTo(...p);ctx.stroke()}points.forEach((p,i)=>{ctx.fillStyle=labels[i]?'#0f0':'#f33';ctx.beginPath();ctx.arc(...p,6,0,Math.PI*2);ctx.fill()})}document.querySelectorAll('.pane')[c].classList.toggle('active',c===active);$('label'+c).textContent=`cam${c} `+(data.cameras[c].exists?'':'缺帧 ')+data.cameras[c].entries.map(e=>`#${e.id}${e.reviewed?'✓':' 待审核'}`).join(' / ')}}
function loadSelected(){reset();let e=layers[active]?.find(e=>e.id===$('object').value);if(e){dc.drawImage(e.im,0,0);let p=dc.getImageData(0,0,1024,768);for(let j=0;j<p.data.length;j+=4){let on=p.data[j]>127;p.data[j]=0;p.data[j+1]=255;p.data[j+2]=100;p.data[j+3]=on?255:0}dc.putImageData(p,0,0)}$('class').value=data.objects[$('object').value]?.class_id??$('class').value;render()}
function select(c){if(c===active)return true;if(dirty&&!confirm('未保存草稿，切换将丢弃。继续？'))return false;active=c;loadSelected();return true}function xy(e,c){let b=cv[c].getBoundingClientRect();return[(e.clientX-b.left)*1024/b.width,(e.clientY-b.top)*768/b.height]}
for(let c=0;c<6;c++){let pane=document.createElement('div');pane.className='pane';pane.innerHTML=`<div class="label" id="label${c}">cam${c}</div><canvas width="1024" height="768"></canvas>`;$('grid').append(pane);cv[c]=pane.querySelector('canvas');$('label'+c).ondblclick=()=>pane.classList.toggle('zoom');cv[c].onpointerdown=e=>{if(busy||!select(c)||!images[c])return;let p=xy(e,c),mode=$('mode').value;if(mode==='positive'||mode==='negative'){points.push(p);labels.push(mode==='positive'?1:0);dirty=true;render();return}if(mode==='polygon'){poly.push(p);dirty=true;render();return}drawing=true;last=p;snap();cv[c].setPointerCapture(e.pointerId);if(mode==='box'){dc.clearRect(0,0,1024,768);$('object').value='';priorObject='';box=[...p,...p]}else paint(p);};cv[c].onpointermove=e=>{if(!drawing||busy||c!==active)return;let p=xy(e,c);if($('mode').value==='box'){box[2]=p[0];box[3]=p[1];dirty=true;render()}else paint(p)};cv[c].onpointerup=()=>{let wasDrawing=drawing;drawing=false;if(box)box=[Math.min(box[0],box[2]),Math.min(box[1],box[3]),Math.max(box[0],box[2]),Math.max(box[1],box[3])];render();if(wasDrawing&&$('mode').value==='box')smart()};cv[c].onpointercancel=()=>drawing=false}
function paint(p){dc.globalCompositeOperation=$('erase').checked?'destination-out':'source-over';dc.strokeStyle='#00ff64';dc.lineWidth=+$('size').value;dc.lineCap='round';dc.beginPath();dc.moveTo(...last);dc.lineTo(p[0]+.01,p[1]);dc.stroke();dc.globalCompositeOperation='source-over';last=p;dirty=true;render()}
$('polygon').onclick=()=>{if(poly.length<3)return;snap();dc.fillStyle='#00ff64';dc.beginPath();dc.moveTo(...poly[0]);poly.slice(1).forEach(p=>dc.lineTo(...p));dc.closePath();dc.fill();poly=[];dirty=true;render()};$('undo').onclick=()=>{if(undo.length){dc.putImageData(undo.pop(),0,0);dirty=true;render()}};$('clear').onclick=()=>{snap();dc.clearRect(0,0,1024,768);box=null;points=[];labels=[];poly=[];dirty=true;render()};$('overlay').onchange=render;let priorObject='';$('object').onchange=()=>{if(dirty&&!confirm('未保存草稿会丢弃，继续？')){$('object').value=priorObject;return}priorObject=$('object').value;loadSelected()};
$('sam').onclick=()=>task(async()=>{if(!box&&!points.length)throw Error('先框选或添加正点／负点');let r=await api('/sam',{frame:f,cam:active,box,points,labels});snap();let im=await loadImage(r.mask);dc.clearRect(0,0,1024,768);dc.drawImage(im,0,0);let p=dc.getImageData(0,0,1024,768);for(let j=0;j<p.data.length;j+=4){let on=p.data[j]>127;p.data[j]=0;p.data[j+1]=255;p.data[j+2]=100;p.data[j+3]=on?255:0}dc.putImageData(p,0,0);dirty=true;render();msg('SAM已生成草稿，可笔刷修正后保存。')});
function maskPNG(){let t=document.createElement('canvas');t.width=1024;t.height=768;let x=t.getContext('2d'),p=dc.getImageData(0,0,1024,768);for(let j=0;j<p.data.length;j+=4){let v=p.data[j+3]>127?255:0;p.data[j]=p.data[j+1]=p.data[j+2]=v;p.data[j+3]=255}x.putImageData(p,0,0);return t.toDataURL()}
function confirmIdentity(){if(busy)return;$('identity').innerHTML=$('object').innerHTML;$('identity').value=$('object').value;$('category').innerHTML=$('class').innerHTML;$('category').value=$('class').value;identityChange();$('confirmDialog').showModal()}
function identityChange(){let id=$('identity').value;$('category').disabled=!!id;if(id)$('category').value=data.objects[id].class_id}
$('identity').onchange=identityChange;$('cancelConfirm').onclick=()=>{nextAfterConfirm=false;$('confirmDialog').close()};$('save').onclick=confirmIdentity;
$('commit').onclick=()=>{$('confirmDialog').close();task(async()=>{let r=await api('/save',{frame:f,cam:active,object:$('identity').value,class_id:+$('category').value,mask:maskPNG(),cross:!nextAfterConfirm});reset();await display(r.data);$('object').value=r.saved_object;priorObject=r.saved_object;loadSelected();msg('已保存目标 #'+r.saved_object+'。\n'+r.log.join('\n'));if(nextAfterConfirm){nextAfterConfirm=false;await nextFrame()}})};
async function smart(){let ok=false;await task(async()=>{let r=await api('/smart',{frame:f,cam:active,box});snap();let im=await loadImage(r.mask);dc.clearRect(0,0,1024,768);dc.drawImage(im,0,0);let p=dc.getImageData(0,0,1024,768);for(let j=0;j<p.data.length;j+=4){let on=p.data[j]>127;p.data[j]=0;p.data[j+1]=255;p.data[j+2]=100;p.data[j+3]=on?255:0}dc.putImageData(p,0,0);box=r.box;dirty=true;render();ok=true;msg('自动分割完成，已调整目标外框。请确认类别及ID，或取消后手动修正。')});if(ok)confirmIdentity()}

async function move(to,track){if(dirty&&!confirm('草稿未保存，放弃后切换？'))return;to=Math.max(0,Math.min(data.count-1,to));let r=track?await api('/track',{frame:to,cross:$('crossauto').checked}):{data:await (await fetch('/frame?f='+to)).json(),log:[]};reset();await display(r.data);loadSelected();msg(r.log.join('\n')||'已加载。')}
$('prev').onclick=()=>task(()=>move(f-1,false));function draftHasRegion(){const pixels=dc.getImageData(0,0,1024,768).data;for(let i=3;i<pixels.length;i+=4){if(pixels[i]>127)return true}return false}
async function nextFrame(){
 // Empty prompts/cleared drafts are not new objects. Existing saved masks are preserved.
 if(dirty&&!draftHasRegion()){reset();loadSelected()}
 if(dirty){let r=await api('/save',{frame:f,cam:active,object:$('object').value,class_id:+$('class').value,mask:maskPNG(),cross:false});reset();await display(r.data);$('object').value=r.saved_object;loadSelected()}
 await api('/approve',{frame:f});await api('/export',{frame:f});
 if(f===data.count-1){await display(await (await fetch('/frame?f='+f)).json());loadSelected();msg('最后一帧已确认、保存并导出。');return}
 await move(f+1,$('auto').checked);msg('上一帧已确认、保存并导出。当前帧自动追踪结果请检查；点击NEXT确认。')
}
$('next').onclick=()=>{if(busy)return;nextAfterConfirm=false;task(nextFrame)};
$('go').onclick=()=>task(()=>move(+$('frame').value,false));
for(let [id,path] of [['cross','/cross'],['stop','/stop'],['approve','/approve'],['export','/export']])$(id).onclick=()=>task(async()=>{if(dirty)throw Error('请先保存或清空草稿');if(['cross','stop'].includes(id)&&!$('object').value)throw Error('先选择目标ID');if(id==='stop'&&!confirm('删除该目标在当前和后续所有相机的标注并停止追踪？历史帧保留。'))return;let r=await api(path,{frame:f,cam:active,object:$('object').value});reset();await display(r.data);loadSelected();msg(r.log.join('\n')||'已完成。')});window.onbeforeunload=e=>{if(dirty){e.preventDefault();e.returnValue=''}};task(async()=>{await display(await (await fetch('/frame?f=0')).json());msg('就绪：选择相机，手绘或框选调用SAM。')});
const more=document.createElement('details');more.innerHTML='<summary>更多设置／导出</summary>';document.querySelector('header').appendChild(more);
for(const id of ['go','frame','export','clear'])more.appendChild($(id));
for(const id of ['auto','crossauto','overlay'])more.appendChild($(id).parentElement);
$('confirmDialog').addEventListener('cancel',()=>{nextAfterConfirm=false});
</script>
